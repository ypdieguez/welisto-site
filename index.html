<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welisto</title>
    <meta name="description" content="Welisto: shopping lists that keep the total for you." />
    <style>
      :root {
        --cream: #f9f8f3;
        --sage: #5d6b55;
        --ink: #1a1a1a;
        --muted: #5f5f5f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --cream: #121410;
          --sage: #a9c09a;
          --ink: #eeece5;
          --muted: #a1a497;
        }
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font: 17px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 40px 16px;
      }
      h1 {
        margin: 0 0 4px;
        font: 700 2rem/1.2 Georgia, 'Times New Roman', serif;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--sage);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welisto</h1>
      <p>Shopping lists that keep the total for you.</p>
      <p><a href="privacy/">Privacy policy</a></p>
    </main>
  </body>
</html>
